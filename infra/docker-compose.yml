services:

  postgres:
    image: postgres:16-alpine
    container_name: arenahub-postgres
    environment:
      POSTGRES_DB: arenahub_dev
      POSTGRES_USER: arenahub
      POSTGRES_PASSWORD: arenahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenahub -d arenahub_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: arenahub-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/arenahub_dev
      DATABASE_USERNAME: arenahub
      DATABASE_PASSWORD: arenahub
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    container_name: arenahub-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: arenahub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
